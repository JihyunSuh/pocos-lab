class: small
# Methods of collecting data
- Three of the most popular methods:

1. .mauve-blue[**Direct observation**] leads to the collection of observational data. 

  - (+) Relatively inexpensive, represent the real world
  - (-) Cannot assess causation 

2. .mauve-blue[**Experiments**] 

  - (+) Able to limit the influence of spurious variables through control and the manipulation of the variables of interest
  - (-) Cost
  - (-) Generalization issue

3. .mauve-blue[**Surveys**]

 - (+) Relatively inexpensive, Efficient
 - (-) Rely on the subjective report

---
class: small
# Survey
A survey solicits information from people; e.g., Gallup polls, pre-election polls, and marketing surveys.

**Different types of survey**

- .mauve-blue[**A personal interview**] is the best approach because it has a higher response rate and fewer incorrect answers, but it requires a trained interviewer to avoid response bias.

- .mauve-blue[**A telephone interview**] is less expensive, but also less personal and has a lower response rate. Cell phones are also more difficult than land lines to include in survey.

- .mauve-blue[**A self-administered survey**] is usually mailed to a sample of people. It is inexpensive and attractive when a large sample is required, but it suffers from low response rates and high rates of incorrect answers.

- .mauve-blue[**An online survey**] is now the most common format (web forms, email invitations, commercial panels). It is fast and cheap, and it scales, but it has two standing problems: people without internet access or not on the panel are never reached (coverage), and those who choose to answer may differ from those who do not (self-selection).

---
class: normalsize
# Sampling
- .mauve-blue[**Sampling**], the process of selecting a subset of the sampled population, is often done for reasons of cost and practicality.

&lt;img src="pic/sampling.jpeg" width="100%" style="display: block; margin: auto;" /&gt;

---
class: small
# From population to data

- .mauve-blue[**Target population**]: the group you want to describe.
- .mauve-blue[**Sampling frame**]: the list you actually draw from (a student registry, a phone number list, a customer database).
- .mauve-blue[**Sample**]: the units drawn from the frame.
- .mauve-blue[**Respondents**]: the units that end up giving you data.

A different error enters at each arrow.

---
class: small
# Two families of sampling methods

.pull-left[
.mauve-blue[**Probability sampling**]

Every unit in the frame has a known, nonzero probability of selection, and that probability is set by chance, not by the researcher.

- Simple random
- Cluster
- Systematic
- Stratified random

Sampling error can be estimated, so inference to the population is defensible.
]
.pull-right[
.mauve-blue[**Non-probability sampling**]

Selection probabilities are unknown. The researcher, the referral chain, or the respondents themselves determine who is included.

- Convenience
- Consecutive
- Quota
- Purposive
- Snowball

Cheaper and sometimes the only option, but the size of the bias cannot be estimated from the data.
]

---
class: small
# Simple random sampling
- Every possible sample of a given size has .mauve-blue[**an equal chance of being selected**]
- The reverse does not hold: systematic and stratified sampling also give each item an equal chance, but they do **not** make every possible sample equally likely
- Depending on the data set size and format, random sampling may be a time-intensive process

&lt;img src="pic/sampling/random_sampling.png" width="100%" style="display: block; margin: auto;" /&gt;

---
class: small
# Cluster sampling
- A simple random sample of groups or clusters of elements
- May increase sampling error because elements belonging to the same cluster are likely to be similar in many respects, including the variable of interest. 

&lt;img src="pic/sampling/clustered.png" width="100%" style="display: block; margin: auto;" /&gt;

---
class: small
# Systematic sampling
- A larger population are selected according to a random starting point but with a fixed, periodic interval `\(k\)`
- Simple to carry out in the field; no full list of random numbers needed
- .mauve-blue[**Main risk: periodicity.**] If the frame has a repeating pattern whose cycle lines up with `\(k\)`, the sample is biased
  - A list ordered male, female, male, female ... with `\(k = 10\)` returns one sex only
  - A daily sales log with `\(k = 7\)` returns the same weekday every time

&lt;img src="pic/sampling/systematic_sampling.png" width="100%" style="display: block; margin: auto;" /&gt;

---
class: small
# Stratified random sampling
- Separating the population into mutually exclusive sets, or strata, and then drawing **simple random samples** from each stratum
- It captures key population characteristics in the sample
- Stratification gives smaller error than simple random sampling **when the strata are internally homogeneous and differ from each other** on the variable of interest
  - Stratifying by a variable unrelated to the outcome buys nothing
- Requires knowing the strata membership of every unit in the frame, which is often the hard part

&lt;img src="pic/sampling/stratified_random.png" width="60%" style="display: block; margin: auto;" /&gt;

---
class: small
# Cluster vs. Stratified

| | .mauve-blue[**Cluster**] | .mauve-blue[**Stratified**] |
|---|---|---|
| Population is split into | clusters (often geographic or organizational) | strata (defined by a known characteristic) |
| What is drawn at random | a subset of **clusters**; all or some units within them | units **within every stratum** |
| Are all groups represented? | No, only the selected clusters | Yes, all strata by design |
| Ideal group composition | each cluster resembles the whole population | units within a stratum are alike, strata differ |
| Effect on precision | usually **worse** than SRS | usually **better** than SRS |
| Main motivation | cost and field logistics | precision and guaranteed coverage of subgroups |

.content-box-blue[
One sentence to remember: cluster sampling picks **groups**, stratified sampling picks **within groups**.
]

---
class: small
# Convenience sampling
- Collect samples from a conveniently available pool of respondents
- Prompt, uncomplicated, and economical
- Potential bias of the sampling technique 

&lt;img src="pic/sampling/convenience.png" width="100%" style="display: block; margin: auto;" /&gt;

---
class: small
# Consecutive sampling
- Every unit that meets the inclusion criteria is taken, in the order it appears, over a defined period
  - Example: every patient admitted to a clinic in March; every customer filing a warranty claim in Q3
- Easier to defend than convenience sampling, since the researcher does not choose whom to include
- The sample still reflects whoever happened to show up during that window, so seasonality and other time-linked factors are built in
- Extending the window increases the sample but does not remove that dependence

&lt;img src="pic/sampling/consecutive.jpg" width="100%" style="display: block; margin: auto;" /&gt;
---
class: small
# Quota sampling
- Non-random selection of a predetermined number or proportion of units
- Because selection is not random and the researcher decides who is included, quota sampling is exposed to selection bias

| | .mauve-blue[**Stratified**] | .mauve-blue[**Quota**] |
|---|---|---|
| Subgroup targets set in advance | Yes | Yes |
| Units drawn within subgroup | at random | by the researcher |
| Selection probabilities | known | unknown |
| Family | probability | non-probability |

&lt;img src="pic/sampling/quota.png" width="30%" style="display: block; margin: auto;" /&gt;

---
class: small
# Purposive sampling
- Samples are selected because they have characteristics that you need in your sample
- Useful if you need to find information-rich cases or make the most out of limited resources
- At high risk for research biases like observer bias

&lt;img src="pic/sampling/purposive.png" width="80%" style="display: block; margin: auto;" /&gt;

---
class: small
# Snowball sampling
- Samples are recruited by other units to form part of the sample
- Useful way to conduct research about people who might otherwise be difficult to identify (e.g., people with a rare disease).
- As the sample is not chosen through random selection, it is not representative of the population being studied
- Relying on referrals may lead to difficulty reaching your sample

---

class: small
# Recap: all nine methods

.pull-left[
.mauve-blue[**Probability**]

- **Simple random**: every possible sample equally likely
- **Systematic**: random start, then every `\(k\)`-th unit
- **Stratified**: random draw inside every stratum
- **Cluster**: random draw of whole groups
]
.pull-right[
.mauve-blue[**Non-probability**]

- **Convenience**: whoever is at hand
- **Consecutive**: everyone eligible in a time window
- **Quota**: fixed subgroup counts, filled non-randomly
- **Purposive**: cases chosen for a needed characteristic
- **Snowball**: participants refer other participants
]

# Sampling: practice ✏️

The manager of the customer service division of a major consumer electronics company is interested in determining whether the customers who have purchased a pair of wireless earbuds over the past 12 months are satisfied with their products. If there are 4 different brands of wireless earbuds made by the company, the best sampling strategy would be to use a:

  a.	simple random sample.
  
  b.	stratified random sample.
  
  c.	cluster sample.
  
  d.	self-selected sample.

---
class: normalsize
# Sampling: practice ✏️

  a.	simple random sample.
  
  .mauve-blue[**b.	stratified random sample.**]
  
  c.	cluster sample.
  
  d.	self-selected sample.

.content-box-blue[
Brand is a known characteristic that divides customers into mutually exclusive groups, and satisfaction plausibly differs across brands. Stratifying by brand guarantees that all four appear in the sample and yields an estimate for each one.

A simple random sample might return few or no customers of a small-share brand. A cluster sample of brands would drop entire brands from the study. A self-selected sample is not a sampling plan at all.
]

# Sampling errors
- .mauve-blue[**Sampling error**] refers to difference existing between a given sample statistic and the population parameter because of the particular set of observations selected for the sample.

&lt;img src="pic/sampling/samplingerror.png" width="70%" style="display: block; margin: auto;" /&gt;

---
class: small
# Sampling errors
- .mauve-blue[**Sampling error**] refers to difference existing between a given sample statistic and the population parameter because of the particular set of observations selected for the sample.
- It is the price of observing a subset rather than the whole population. It exists even when everything is done correctly.
- The sampling error decreases as the sample size becomes larger.

.content-box-blue[
- Example:
Suppose that we wish to estimate the mean annual amount of steel production in the world making an inference from the annual amount of steel production from POSCO.

The sampling error is the difference between the sample mean steel production from POSCO and the population mean annual steel production.
]

.mauve-blue[**Note:**] POSCO is not a randomly drawn producer, so most of the gap here is bias, not sampling error. Enlarging a non-random sample does not close that gap. Keep the two apart.

---
class: small
# How fast does sampling error shrink?

For a sample mean, the standard error is

`$$SE = \frac{\sigma}{\sqrt{n}}$$`

The error falls with `\(\sqrt{n}\)`, not with `\(n\)`.

| `\(n\)` | Relative error |
|---|---|
| 100 | 1.00 |
| 400 | 0.50 |
| 1,600 | 0.25 |
| 6,400 | 0.125 |

.content-box-blue[
To cut the error in half, you need **four times** the sample. This is why national polls stop around `\(n = 1{,}000\)`: the next increment of precision costs far more than it is worth.

We will use this expression again when we build confidence intervals.
]

---
class: small
# Nonsampling errors
.content-box-blue[
- .mauve-blue[**Nonsampling errors**] are more serious and are due to mistakes made in the acquisition of data or due to improperly selected sample observations.
- Increasing the sample size .mauve-blue[**will not reduce**] a nonsampling error.
]

- **There are three types of nonsampling errors:**
1. .mauve-blue[**Errors in data acquisition**] arise from the recording of incorrect responses caused by inaccurate measurements, transcription mistakes, inaccurate data recording, or inaccurate responses to questions.

2. .mauve-blue[**Nonresponse errors**] happen when the people who answer differ systematically from the people who do not, on the variable being measured. A low response rate is a warning sign, not the error itself: if nonrespondents were just like respondents, a low rate would cost precision but not accuracy.

3. .mauve-blue[**Selection bias**] occurs when part of the target population is not included in the sampling plan, so those units have no chance of being selected.

---
class: small
# One word, two meanings

.mauve-blue[**"Selection"**] appears twice in this course with different referents.

.pull-left[
**Selection bias** (sampling)

Part of the target population is missing from the sampling frame, so it can never be sampled.

- Threatens: who the estimate describes
- Example: a phone survey that omits households without a landline
]
.pull-right[
**Selection** (internal validity)

The groups being compared differed before any treatment was applied.

- Threatens: the causal claim
- Example: employees who attend optional training vs. those who do not
]

.content-box-blue[
When you meet the word, ask which question is at stake: *whom does this describe?* or *did the treatment cause this?*
]

class: small
# Measuring the invisible
In order to infer that A --&gt; B, we have to make three assumptions:

- X is a good proxy for A
- Y is a good proxy for B
- X and Y are causally related

.content-box-blue[
When the first two assumptions are true, the relation between X and Y will provide a good estimate of the relation between A and B.

- What threatens our ability to carry out this seemingly simple task?

- How do quantitative methods help us solve these problems?
]

---
class: small
# Reliability

.mauve-blue[**Reliability**] is the consistency of a measure: how much of the observed variation is signal rather than noise.

- **Test-retest**: the same people, the same instrument, two occasions
- **Internal consistency**: items meant to tap one construct agree with each other (Cronbach's `\(\alpha\)`)
- **Inter-rater**: two coders scoring the same material agree

.content-box-blue[
Reliability is necessary but not sufficient for validity.

- A scale that reads 3 kg heavy every time is perfectly reliable and invalid.
- An unreliable measure cannot be valid: if the measure is mostly noise, the label on it does not matter.

Unreliability also has a statistical consequence. Noise in X or Y pushes the observed correlation toward zero, so a real relation can be missed simply because the measures were poor.
]

---

- **External validity**

- **Statistical conclusion validity**

# Threats to internal validity

- The key point with internal validity is that .mauve-blue[**something else besides the treatment is a plausible alternative explanation**] for any apparent treatment effect.

- Solving threats to internal validity is a research .mauve-blue[**design problem**], not a statistics problem. Nonetheless, quantitative methods play a key role in making the case for internal validity.

- If the .mauve-blue[**"other variables"**] can be measured, their influence can be statistically controlled so that the hypothesized relation can be detected more accurately.

However:

- .mauve-blue[**Statistical control should best be thought of as a method of last resort**], to be used when design controls are not available or have failed.

.mauve-blue[**Construct validity**] refers to the correctness of the label that is applied to the operation. It depends on first demonstrating adequate reliability and then is bolstered by demonstrating relations of the target operation to other operations.

class: small
# Threats to construct validity

- .mauve-blue[**Inadequate explication of constructs**]

- .mauve-blue[**Construct confounding**]

- Confounding constructs with levels of constructs

- Reactive self-report changes

- Reactivity to the experimental situation

- Experimenter expectancy

- Novelty and disruption effects

---
class: small
# Inadequate explication of constructs
.pull-left[
The construct was never pinned down clearly enough, so the operation that follows from it can be wrong in a way no amount of data will reveal.

Two forms:

- **Too broad**: "well-being" measured with a single life-satisfaction item
- **Too narrow**: "customer loyalty" measured only as repeat purchase, ignoring advocacy and price tolerance
]
.pull-right[
.content-box-blue[
The remedy is conceptual, not statistical: state what the construct includes, what it excludes, and how it differs from its neighbors, **before** choosing the measure.

Example: if "engagement" is defined as time on site, a slow page counts as success.
]
]

---
class:small
# Construct confounding
.pull-left[

Operations usually tap more than one construct. Failure to recognize the full set of constructs embedded in the operation can lead to incorrect inferences about the constructs that are active.

Example:
- A self-report of optimism might also reflect self-esteem or positive affect.
]
.pull-right[
&lt;img src="pic/confounding.jpeg" width="100%" style="display: block; margin: auto;" /&gt;
]

We can't study an entire population, so instead we take samples. 

If your sample is not representative of the population however, then how on Earth can you generalize to that population?

]
.pull-right-70[
.content-box-blue[
The experimenter's own expectations shape the data: through tone of voice, which responses get probed further, how ambiguous answers are scored.

- Rosenthal's studies: experimenters told their rats were "bright" recorded better maze performance from randomly assigned animals.

Remedy: blind the person collecting or scoring the data to condition.
]
]

.pull-right-70[
.content-box-blue[
Participants form a guess about the study's purpose and act on it.

"What if I told all my research participants that my job depended on the outcome of the study they are in?"

- The participants might change their behaviors. And their behavior is what we are studying.

- So anything I find might not generalize beyond people who were given that cue.
]
]

# Statistical conclusion validity

**Definition**: the validity of the inference that X and Y covary at all, and of the estimate of how strongly.

Internal validity asks whether the relation is causal. This asks a prior question: is there a relation, and did we size it correctly?

.content-box-blue[
Common threats, each of which we will take up later in the course:

- .mauve-blue[**Low statistical power**]: a real effect is missed because `\(n\)` was too small
- .mauve-blue[**Violated assumptions**]: the test used does not fit the data
- .mauve-blue[**Fishing / multiple comparisons**]: run 20 tests at `\(\alpha = .05\)` and one comes out "significant" by construction
- .mauve-blue[**Unreliable measures**]: noise attenuates the observed relation
- .mauve-blue[**Restriction of range**]: a truncated variable cannot show its full association
]

# Your Ethical Duty as a Scientist
Advanced skill in quantitative methods carries with it the responsibility to use those skills .mauve-blue[**carefully**] and .mauve-blue[**ethically**].

- Know the shortcomings of your study
- REPORT the shortcomings of your study
- Let your readers understand the limitations
- DO NOT overstate your findings (or let the press overstate them) Confusing Qualitative and Quantitative
  - happens more than you think; esp in the machine learning world
  - can straight up get the wrong numbers (will come back to this with correlation!)
