class: normalsize
# Ratio scale
- An absolute **'zero'** point
  - You can measure the absolute amount of variable
  - Allows to calculate 'ratio'
  - Example: 10 liter of water in a jar has twice as much water as a jar of 5 liter
  
&lt;img src="pic/ratio_scale.png" width="87%" style="display: block; margin: auto;" /&gt;

---
class: normalsize
# Interval scale
- Ordered category with equal intervals
  - Separate adjacent scores and **arbitrary zero**
  - Example:temperature, IQ score
  - 80 `\(^\circ\)` is 40 `\(^\circ\)` higher than 40 `\(^\circ\)` but not twice as hot as 40 `\(^\circ\)`
  
&lt;img src="pic/interval_scale.png" width="87%" style="display: block; margin: auto;" /&gt;

---
class: normalsize
# Ordinal scale
- Consists of a set of categories that are organized in _an ordered sequence_
- You can think of ordinal scale as a _rank order_
  - Example:
    - 1st, 2nd, 3rd...(rank)
    - small, medium, large
    - Bronze, silver, gold medal
    - Never, less than once a month, 1 - 3 times a month, every week, more than once a week
    
&lt;img src="pic/ordinal_scale.png" width="56%" style="display: block; margin: auto;" /&gt;

---
class: normalsize
# Nominal scale (qualitative)
- Consists of a set of categories that have different names
- Do no make any quantitative distinctions between observations
  - Example: Your primary mode of transportation to work
      - Automobile, Bus, Subway, Bicycle, Walking
- No category is greater than or smaller than any other category

&lt;img src="pic/nominal_scale.png" width="76%" style="display: block; margin: auto;" /&gt;

---
class: normalsize
# Measurment scale
&lt;img src="pic/measure_cal_table.png" width="62%" style="display: block; margin: auto;" /&gt;

- Arithmetic mean = `\(AM = \frac{a_1+a_2+a_3+a_4+...+a_n}{n}\)` 
- Geometric mean = `\(GM = ^n\sqrt{a_1a_2a_3...a_n}\)`

# Histogram

.mauve-blue[**Advantages of Histogram**]
- One of the most widely used format of the plot
- A single glance at a histogram gives us some idea about the shape and spread of the data
- Can represent a large number of bars representing different class intervals

# Histogram

.vibrant-red[**Disadvantages of Histogram**]
- A histogram cannot be used to represent discrete frequency distributions
- Histograms cannot be used to compare two different data sets
- While the mode can be calculated using a histogram, the mean and the median cannot be calculated using a histogram

class: normalsize
# Histogram
- How can we determine the bin size?
- An alternative to the guidelines listed in the table to the left is to use __Sturges’s formula__, which recommends that the number of class intervals be determined by the following:
 Number of class intervals = 1 + 3.3 `\(log(n)\)`
  
  if n = 50, Sturges's formula = 1 + 3.3 `\(log(50)\)` = 1 + 3.3(1.7) = 6.6 ~= 7

---
class: normalsize
# Histogram
- How to determine the bin size (cont.)

- Class width = `\(\frac{Largest \ Observation - Smallest \ Observation}{Number \ of \ classes}\)` 
  
  if largest = 99, smallest = 16, the number of classes = 9,
  
  Class width = (99 - 16)/9 = 9.22

# Histogram
- Shapes of Histogram: Symmetric


&lt;img src="data_type_cont_lecture_script_files/figure-html/unnamed-chunk-17-1.png" width="60%" style="display: block; margin: auto;" /&gt;

A histogram is said to be symmetric if, when we draw a vertical line down the center of the histogram, the two sides are identical in shape and size.

---
class: normalsize
# Histogram
- Shapes of Histogram

&lt;img src="data_type_cont_lecture_script_files/figure-html/unnamed-chunk-18-1.png" width="60%" style="display: block; margin: auto;" /&gt;
A skewed histogram has one of the two tails extending more than the other one. If the longer tail is to the right, the histogram is said to be positively skewed, and if the longer tail is to the left, it is said to be negatively skewed.

---
class: normalsize
# Histogram
- Shapes of Histogram
&lt;img src="data_type_cont_lecture_script_files/figure-html/unnamed-chunk-19-1.png" width="70%" style="display: block; margin: auto;" /&gt;

- A modal class is the class with the largest number of observations.
- A unimodal histogram is one with a single peak.
- A bimodal histogram is one with two peaks, not necessarily equal in height.

---
class: normalsize

- Shapes of Histogram
&lt;img src="data_type_cont_lecture_script_files/figure-html/unnamed-chunk-20-1.png" width="50%" style="display: block; margin: auto;" /&gt;
*Bell-shaped*: symmetric, single-peaked, with values concentrated in the center and tapering off equally toward both tails (a normal distribution).

- Does not reveal much about the skewness or kurtosis of the data

# Relationship between two values: Scatter
.pull-left[
**Advantages of Scatter plot**
- are very easy to plot and interpret
- Outliers are isolated and do not affect the results
- Shows how strongly two variables are related &amp; direction of the relationship
]
.pull-right[
**Disadvantages of Scatter plot**
- Only depicts the direction but not the degree of correlation
- If there are too many points to be plotted then the scatter diagram becomes too cluttered and unreadable
- Does not show the relationship for more than two variables
]

1. It presents large data sets concisely and coherently
