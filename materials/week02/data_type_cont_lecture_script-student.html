<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Business Statistics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Sora:wght@600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light dark;
  --bg:#F4F6F8; --surface:#FFFFFF; --ink:#14171D; --ink-2:#3F4855; --muted:#6E7887;
  --line:#DCE1E8; --line-strong:#C1C9D4; --accent:#12734A; --on-accent:#FFFFFF;
  --accent-bg:#E4F2EA; --danger:#A3212F;
  --sans:"Archivo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Sora","Archivo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#191D24; --ink:#E9ECF1; --ink-2:#C0C7D1; --muted:#8A94A2;
  --line:#2A313A; --line-strong:#3D4652; --accent:#54CC8B; --on-accent:#0A2417;
  --accent-bg:#13301F; --danger:#F0808F;
}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#191D24; --ink:#E9ECF1; --ink-2:#C0C7D1; --muted:#8A94A2;
  --line:#2A313A; --line-strong:#3D4652; --accent:#54CC8B; --on-accent:#0A2417;
  --accent-bg:#13301F; --danger:#F0808F;
}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.5;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:10px;padding:30px 28px;
  box-shadow:0 1px 2px rgba(16,20,28,.05),0 10px 30px -18px rgba(16,20,28,.3)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px}
h1{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.03em;
  line-height:1.2;margin:0 0 10px}
p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input{font:inherit;font-size:15px;width:100%;color:var(--ink);background:var(--bg);
  border:1px solid var(--line-strong);border-radius:7px;padding:10px 12px}
input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;font-size:14px;font-weight:600;width:100%;margin-top:12px;
  padding:11px 16px;border-radius:7px;border:1px solid var(--accent);
  background:var(--accent);color:var(--on-accent);cursor:pointer}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:12px;font-size:13px;min-height:19px}
.msg.err{color:var(--danger);font-weight:600}
.msg.ok{color:var(--muted)}
.foot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted)}
.foot a{color:var(--accent)}
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">MSIP506-01 · Business Statistics</p>
  <h1>Business Statistics</h1>
  <p class="sub">수강생에게 공지된 비밀번호를 입력하세요.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Class password</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="go" type="submit">열기</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <p class="foot"><a href="../../index.html">&larr; POCOS Lab</a></p>
</main>

<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("payload").textContent);
  var KEY = "pocos-class-pw";
  var msg = document.getElementById("msg");
  var pw  = document.getElementById("pw");
  var go  = document.getElementById("go");

  function b64(s) {
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  async function unlock(pass, quiet) {
    if (!pass) return false;
    if (!window.crypto || !crypto.subtle) {
      msg.className = "msg err";
      msg.textContent = "이 브라우저에서는 열 수 없습니다. 주소가 https로 시작하는지 확인해 주세요.";
      return false;
    }
    go.disabled = true;
    if (!quiet) { msg.className = "msg ok"; msg.textContent = "여는 중…"; }
    try {
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(data.salt), iterations: data.iter, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(data.iv) }, key, b64(data.ct));
      var html = new TextDecoder().decode(plain);
      try { localStorage.setItem(KEY, pass); } catch (e) {}
      document.open(); document.write(html); document.close();
      return true;
    } catch (e) {
      go.disabled = false;
      if (!quiet) {
        msg.className = "msg err";
        msg.textContent = "비밀번호가 맞지 않습니다.";
        pw.select();
      } else {
        msg.textContent = "";
      }
      try { if (quiet) localStorage.removeItem(KEY); } catch (e2) {}
      return false;
    }
  }

  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    // students often paste with a stray space on the end
    unlock(pw.value.trim(), false);
  });

  // already unlocked something else this session? open straight away
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(saved, true);
})();
</script>
