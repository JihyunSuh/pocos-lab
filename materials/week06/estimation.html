class: normalsize
# Check in



By now, you should feel comfortable with:

- Difference between **population** and **sampling distribution**
- **Central Limit Theorem**

???

Hello, everyone. Welcome back. Let's start with a quick check.

In the last classes, we learned about probability, distributions, and sampling distributions. Today, we will use all of them.

Look at the two points on the slide. First, a population distribution and a sampling distribution are different. The population distribution shows the values of single items. For example, the height of every adult in one city. The sampling distribution shows the values of a sample mean. For example, the mean height of 25 people, measured again and again with new samples.

Second, the Central Limit Theorem. We call it CLT for short. It says that the sample mean is close to normal when the sample is large enough.

Do you feel comfortable with these two ideas? If not, please ask me now. We need both of them today.

Today's topic is estimation. Let's see what that word means.

---
class: small
# Estimation
- The goal of estimation: compute the **approximate value of a population parameter based on a sample statistic**
- There are two ways:

&lt;img src="pic/est1.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

???

So, what is estimation? We want to know a number about the whole population. We call this number a parameter. A parameter is a number that describes the population, like the true mean.

For example, what is the true mean waiting time for all food delivery orders in Seoul this month? We cannot check every order. It takes too much time and money.

So we take a sample. A sample is a small group we select from the population. It is like cooking soup. You do not eat the whole pot to check the taste. You taste one spoonful. From the sample, we calculate a statistic. A statistic is a number that describes the sample, like the sample mean.

Then we use the statistic to make a careful guess about the parameter. This guess is called an estimate. The whole process is called estimation.

The slide says there are two ways to do this. Let's look at them one at a time.

---
class: small
# Estimation
- The goal of estimation: compute the approximate value of a population parameter based on a sample statistic
- There are two ways:

&lt;img src="pic/est2.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;

???

The first way is called a point estimate. A point estimate is one single number.

For example, imagine a stock analyst on the news. She says, "One year from now, this company's stock will be 250 dollars." That one number is a point estimate.

It is simple. It is easy to remember, and it is easy to report to your manager. But think about it. Will the price be exactly 250 dollars next year? Probably not. Maybe it will be 230. Maybe it will be 280. Nobody knows. And the analyst does not tell us how far from 250 the price could be.

What do you think? How much can we trust one number? Let's see the second way.

---
class: small
# Estimation
- The goal of estimation: compute the approximate value of a population parameter based on a sample statistic
- There are two ways:

&lt;img src="pic/est3.png" alt="" width="100%" style="display: block; margin: auto;" /&gt;


???

The second way is called an interval estimate. An interval is a range of values. It has a lower end and an upper end.

Let's go back to the stock analyst. This time she says, "One year from now, the stock will be between 180 and 320 dollars." That is an interval estimate. In statistics, we also say how confident we are, for example 95%.

This gives more information. The middle of the range, 250 dollars, is still her best guess. But now we also see how uncertain she is. The range is very wide, 140 dollars from the bottom to the top. So we know her guess is not very precise. If she said "between 240 and 260 dollars," that would show much more certainty.

So an interval tells us two things: the best guess, and how much we can trust it.

Think about your own work. A supplier tells you, "The delivery will take between 5 and 7 days." That is more useful than just "6 days." Now you know how much time to plan for.

Next, let's compare these two ways on one slide.

---
class: small
# Estimation

.pull-left[
.mauve-blue[**Point Estimator**]
- A **point estimator** draws inferences about a population by estimating the value of an unknown parameter using a single value or point.
- Example: "Mean demand is 370 units."
- .vibrant-red[**Drawbacks**]:
  - It is almost always wrong by at least a little (for a continuous variable, the chance of hitting the exact value is virtually 0)
  - It does not tell us how close the estimate is to the population parameter
  - It does not show the benefit of a larger sample size
]

.pull-right[
.mauve-blue[**Interval Estimator**]
- An **interval estimator** draws inferences about a population by estimating the value of an unknown parameter using a range of values.
- Example: "Mean demand is between 340.6 and 399.4 units, with 95% confidence."
- .mid-green[**Advantages**]:
  - It tells us how precise the estimate is (the width of the interval)
  - It comes with a confidence level (e.g., 95%)
  - The interval gets narrower as the sample size grows larger
]

???

Here are the two ways, side by side. The slide uses the word estimator. An estimator is the rule or formula we use. The estimate is the number we get from it. For example, "the sample mean" is an estimator. "370 units" is an estimate.

On the left is the point estimator. The example says, "Mean demand is 370 units." Just one number.

It has three weak points. First, it is almost always a little wrong. For a continuous variable, like demand or waiting time, the chance of hitting the exact true value is almost zero. Second, it does not tell us how close we are. Third, a sample of 10 and a sample of 1,000 both give just one number. We cannot see the benefit of more data.

On the right is the interval estimator: "between 340.6 and 399.4 units, with 95% confidence." It shows how precise we are, it has a confidence level, and it gets narrower with more data.

We will calculate this exact interval later today.

---
class: small
# Qualities of a Good Estimator

Whether we report a point or an interval, we want the estimator itself to be good. Three desirable qualities:

.content-box-blue[
1. .mauve-blue[**Unbiased**]: its expected value equals the parameter. On average, it hits the target.
    - `\(\bar{x}\)` is an unbiased estimator of `\(\mu\)`, because `\(E(\bar{X}) = \mu\)`.
2. .mauve-blue[**Consistent**]: the difference between the estimator and the parameter grows smaller as the sample size grows larger.
    - `\(\bar{x}\)` is consistent, because its standard error `\(\sigma/\sqrt{n}\)` shrinks as `\(n\)` grows.
3. .mauve-blue[**Relatively efficient**]: if two estimators are both unbiased, the one with the smaller variance is relatively more efficient.
    - For a normal population, the sample mean has a smaller variance than the sample median, so `\(\bar{x}\)` is relatively more efficient.
]

- The sample mean `\(\bar{x}\)` has all three qualities. That is why we use it to estimate `\(\mu\)`.

???

Before we build intervals, let's ask one question. What makes an estimator good? There are three qualities.

First, unbiased. The expected value is the long-run average. If we take many samples and average all the estimates, we get the true value. Think of a good kitchen scale. Some readings are a little high, some a little low, but on average it is correct.

Second, consistent. With a bigger sample, the estimate gets closer to the true value. The standard error is the typical distance between x-bar and mu. It is sigma over the square root of n. When n grows, it gets smaller.

Third, relatively efficient. Variance measures how spread out the values are. If two estimators are both unbiased, we choose the one with less spread. For a normal population, the sample mean spreads less than the sample median. The median is the middle value.

The good news: x-bar has all three qualities. So we use x-bar to estimate mu, the population mean.

Now let's build the interval.

---
class: small
# From Sampling Distribution to Confidence Interval

Last class: by the Central Limit Theorem, `\(\bar{X}\)` is (approximately) normal, so
`$$Z = \frac{\bar{X}-\mu}{\sigma/\sqrt{n}} \text{ is standard normal.}$$`

???

Let's connect this to the last class. By the Central Limit Theorem, the sample mean x-bar is approximately normal.

So we can standardize it. We subtract mu, and we divide by sigma over the square root of n. The result is Z. Z is standard normal. Standard normal means a normal distribution with mean 0 and standard deviation 1.

This is the same formula you used in the last class. Nothing new yet.

Let's see the next step.

--

So the middle `\(1-\alpha\)` of the `\(Z\)` values satisfy:
`$$P\left(-z_{\alpha/2} &lt; \frac{\bar{X}-\mu}{\sigma/\sqrt{n}} &lt; z_{\alpha/2}\right) = 1-\alpha$$`

???

Now, alpha. Alpha is a small probability, like 0.05. So 1 minus alpha is the large middle area, like 0.95.

The middle 1 minus alpha of the Z values lie between minus z alpha over 2 and plus z alpha over 2. Each tail outside has area alpha over 2.

For example, if alpha is 0.05, the middle area is 0.95. Each tail has 0.025. The z value is 1.96. So 95% of the Z values are between minus 1.96 and plus 1.96.

This is a probability statement about Z. Next, we will move the terms so that mu stands alone in the middle.

--

Rearrange the inequality so that `\(\mu\)` is in the middle:
`$$P\left(\bar{X}-z_{\alpha/2}\frac{\sigma}{\sqrt{n}} &lt; \mu &lt; \bar{X}+z_{\alpha/2}\frac{\sigma}{\sqrt{n}}\right) = 1-\alpha$$`

.content-box-blue[
Last class we asked: "Where do the sample means fall?" ( `\(\mu \pm 1.96\,\sigma/\sqrt{n}\)` )

Today we flip it: "Where is `\(\mu\)`, given our sample mean?" ( `\(\bar{x} \pm 1.96\,\sigma/\sqrt{n}\)` )
]

???

Here we rearrange the inequality. It is simple algebra. We multiply by sigma over root n, and we move x-bar to the other side. Root n means the square root of n. You do not need to remember these steps. Remember only the result.

Now mu is in the middle. The lower end is x-bar minus z times sigma over root n. The upper end is x-bar plus z times sigma over root n.

Look at the blue box. Last class we asked, "If we know mu, where do the sample means fall?" The answer was mu plus or minus 1.96 sigma over root n.

Today we ask the question in the other direction. We do not know mu. We have one sample mean. So we ask, "Where is mu?" The answer is x-bar plus or minus 1.96 sigma over root n.

For example, we know the mean taxi fare in our sample of rides. Now we can give a range for the true mean fare of all rides.

Next, let's write this as our main formula.

---
class: small
# Interval Estimation
.content-box-blue[
.mauve-blue[**Confidence interval estimator of**] `\(\mu\)` (when `\(\sigma\)` is known)
`$$\bar{x}-z_{\alpha/2}\frac{\sigma}{\sqrt{n}}&lt;\mu&lt;\bar{x}+z_{\alpha/2}\frac{\sigma}{\sqrt{n}}$$`
]

- Short form: `\(\bar{x} \pm z_{\alpha/2}\dfrac{\sigma}{\sqrt{n}}\)`, that is, **point estimate ± margin of error**
- `\(\bar{x}-z_{\alpha/2}\sigma/\sqrt{n}\)` is the .mauve-blue[lower confidence limit (LCL)]; `\(\bar{x}+z_{\alpha/2}\sigma/\sqrt{n}\)` is the .mauve-blue[upper confidence limit (UCL)]
- The probability `\(1-\alpha\)` is called the .mauve-blue[**confidence level**]
- Conditions: `\(\sigma\)` is known, and the population is normal or `\(n\)` is large (about 30 or more)
- If `\(\sigma\)` is unknown, we use the sample SD `\(s\)` and the `\(t\)` distribution (coming later)

???

Here is the main formula for today. It is the confidence interval for mu when sigma is known. A confidence interval is a range that we are confident includes the true mean.

The short form is x-bar plus or minus z times sigma over root n. There are two parts. The point estimate, x-bar, is the center. The margin of error, z times sigma over root n, is how far we go down and up from the center.

The lower end is the lower confidence limit, or LCL. The upper end is the upper confidence limit, or UCL. The probability 1 minus alpha is the confidence level, like 95%.

There are two conditions. First, sigma must be known. Second, the population is normal, or n is about 30 or more. Then the CLT helps us.

What if sigma is unknown? Then we use s, the sample standard deviation, and a new distribution called the t distribution. We will learn it later.

So where does the z value come from? Let's see.

---
class: small
# Interval Estimation
.content-box-blue[
`$$\bar{x}-z_{\alpha/2}\frac{\sigma}{\sqrt{n}}&lt;\mu&lt;\bar{x}+z_{\alpha/2}\frac{\sigma}{\sqrt{n}}$$`
The probability `\(1-\alpha\)` is the confidence level.
]

|1- `\(\alpha\)` | `\(\alpha\)` | `\(\alpha/2\)` | `\(z_{\alpha/2}\)` |
|:----:|:----:|:----:|:----:|
|.90|.10|.05| `\(z_{.05}=1.645\)` |
|.95|.05|.025| `\(z_{.025}=1.96\)` |
|.99|.01|.005| `\(z_{.005}=2.58\)` |

- `\(z_{\alpha/2}\)` is the `\(z\)` value with an area of `\(\alpha/2\)` to its **right**. For 95%: the area to the left of 1.96 is .975 (z-table, read backwards).

???

The z value depends on the confidence level. Here are the three most common levels.

Let's read the 95% row. 1 minus alpha is .95, so alpha is .05. Each tail gets half, so alpha over 2 is .025. The z value with .025 to its right is 1.96.

How do we find 1.96? We use the z-table backwards. The z-table gives the area to the left of a z value. The area to the left is 1 minus .025, which is .975. Find .975 inside the table. The z value there is 1.96.

In the same way, for 90%, z is 1.645. For 99%, z is 2.58.

Please remember these three numbers: 1.645, 1.96, and 2.58. You will use them many times today, and also in the next class.

Now let's see these three levels as pictures.

---
class: small
# Interval Estimation: 90% CI
.content-box-blue[
`$$\bar{x}-1.645\frac{\sigma}{\sqrt{n}}&lt;\mu&lt;\bar{x}+1.645\frac{\sigma}{\sqrt{n}}$$`
]

&lt;img src="estimation_files/figure-html/ci90-1.png" alt="" style="display: block; margin: auto;" /&gt;

???

Here is the picture for 90%. This is the standard normal curve.

The green area in the middle is 90%. The dashed lines are at minus 1.645 and plus 1.645. Each tail outside the lines has 5%. That is alpha over 2.

So in our formula, we use 1.645. The interval is x-bar plus or minus 1.645 times sigma over root n.

For example, a student wants to know the mean Wi-Fi speed in her new apartment. She tests the speed at random times during the week. If 90% confidence is enough for her decision, she uses 1.645.

Now, what happens if we want to be more confident? Let's look at 95%.

---
class: small
# Interval Estimation: 95% CI
.content-box-blue[
`$$\bar{x}-1.96\frac{\sigma}{\sqrt{n}}&lt;\mu&lt;\bar{x}+1.96\frac{\sigma}{\sqrt{n}}$$`
]

&lt;img src="estimation_files/figure-html/ci95-1.png" alt="" style="display: block; margin: auto;" /&gt;

???

This is 95%. It is the most common level in business and in science.

The green middle area is now 95%. The dashed lines move out to minus 1.96 and plus 1.96. Each tail has 2.5%.

Compare this with the last slide. The lines moved outward. The middle area got bigger. So the interval also gets a little wider.

If you are not sure which level to use, 95% is the usual choice. Many reports and software programs use 95% by default. Default means the setting you get if you do not change anything.

Let's go one more step, to 99%.

---
class: small
# Interval Estimation: 99% CI
.content-box-blue[
`$$\bar{x}-2.58\frac{\sigma}{\sqrt{n}}&lt;\mu&lt;\bar{x}+2.58\frac{\sigma}{\sqrt{n}}$$`
]

&lt;img src="estimation_files/figure-html/ci99-1.png" alt="" style="display: block; margin: auto;" /&gt;

- Higher confidence → larger `\(z_{\alpha/2}\)` → wider interval.

???

Here is 99%. The dashed lines are now at minus 2.576 and plus 2.576. On our slides, we round this to 2.58. Each tail has only 0.5%.

Look at the last line on the slide. Higher confidence means a larger z value. A larger z value means a wider interval.

Why? If you want to be almost sure the true value is inside, you must make the range wide. For example, "The mean exam score of the class is between 60 and 90 points" is easier to be sure about than "between 74 and 76 points."

So there is a trade-off. A trade-off means you gain one thing but you lose another. We gain confidence, but we lose precision.

Now let's calculate a real interval.

---
class: small
# Example
.content-box-blue[
To lower inventory cost, POSCO's operations manager wants to estimate the mean product demand during lead time at a 95% confidence level.

A sample of 25 lead times is collected and the demand during each period is recorded. The sample mean demand is 370 units. Assume that the population standard deviation of demand is known: 75 units.
]

- `\(\bar{x} = 370\)`, `\(\sigma = 75\)`, `\(n = 25\)`, `\(z_{.025} = 1.96\)`

???

Here is a POSCO example. The operations manager wants to lower inventory cost. Inventory is the stock of materials or products we keep. To plan inventory, the manager needs the mean demand during lead time. Lead time is the time between placing an order and receiving it.

A sample of 25 lead times is collected. The sample mean demand is 370 units. The population standard deviation is known: 75 units.

Let's list what we have. x-bar is 370. Sigma is 75. n is 25. For 95% confidence, z is 1.96.

Before I show the next step, think for a moment. What is the first thing we should calculate?

--

`$$\bar{x}-1.96\frac{\sigma}{\sqrt{n}}&lt;\mu&lt;\bar{x}+1.96\frac{\sigma}{\sqrt{n}}$$`

???

Here is the formula again. We just put our numbers into it.

The center is x-bar, 370. To find the two ends, we need the margin of error: 1.96 times sigma over root n.

--

`$$370-1.96\frac{75}{\sqrt{25}}&lt;\mu&lt;370+1.96\frac{75}{\sqrt{25}} \quad\Rightarrow\quad 370 \pm 1.96(15) = 370 \pm 29.4$$`

???

Let's calculate step by step. First, the square root of 25 is 5. Then 75 divided by 5 is 15. This 15 is the standard error.

Next, 1.96 times 15 is 29.4. This is the margin of error.

So the interval is 370 plus or minus 29.4.

--

`$$340.6&lt;\mu&lt;399.4$$`

- We are 95% confident that the mean demand during lead time is between 340.6 and 399.4 units.

???

370 minus 29.4 is 340.6. 370 plus 29.4 is 399.4. So the interval is from 340.6 to 399.4 units.

How do we say this in words? "We are 95% confident that the mean demand during lead time is between 340.6 and 399.4 units."

This is useful for the manager. She can plan inventory for a range, not just for one number.

But what does "95% confident" really mean? Let's look at a simulation.

---
class: small
# How to interpret CI?
- Each vertical line is one 95% confidence interval, built from a new random sample of 10 observations.
- 95% confidence interval: if we repeat the sampling many times, about 95% of the intervals built this way will capture the population mean.

&lt;img src="estimation_files/figure-html/ci-sim-1.png" alt="" style="display: block; margin: auto;" /&gt;



???

This picture is a simulation. A simulation is an experiment on a computer. We pretend that we know the truth. Here, the true mean is 10, and sigma is 4. The red horizontal line is the true mean.

The computer takes a random sample of 10 observations. It calculates x-bar and a 95% interval. That is one vertical line. It does this 100 times.

Look at the lines. Most of them cross the red line. Those intervals caught the true mean. A few intervals are red. They missed the true mean. The subtitle shows how many missed. We expect about 5 out of 100.

Think of it this way. Imagine 100 survey teams. Each team asks 10 random gym members how many minutes they exercise each visit, and builds a 95% interval. About 95 intervals will include the true mean. About 5 will not. Each team sees only its own interval. It does not know if its interval is a good one or a bad one.

So what is the correct meaning of our interval? Let's check.

---
class: small
# How to interpret CI?
`$$340.6&lt;\mu&lt;399.4$$`
- Which one is correct?
1. "There is a 95% probability that the population parameter lies between 340.6 and 399.4."

2. "If we repeatedly draw samples of size 25 from a population, 95% of the interval estimates will include the unknown population parameter and 5% will not."

???

Here is our interval from the POSCO example: 340.6 to 399.4.

Here are two sentences. Please read them carefully.

Sentence 1 says there is a 95% probability that the true mean is between 340.6 and 399.4.

Sentence 2 says that if we repeat the sampling many times, 95% of the intervals will include the true mean.

Which one is correct? Take 30 seconds. Talk with your neighbor. Then raise your hand for sentence 1 or sentence 2.

--

- **Statement 2** is correct. `\(\mu\)` is a fixed number; it is the interval that changes from sample to sample. "95%" describes how often the *method* works.

&lt;img src="estimation_files/figure-html/ci-sim-370-1.png" alt="" style="display: block; margin: auto;" /&gt;

???

The answer is sentence 2.

Why not sentence 1? The true mean, mu, is a fixed number. It does not move. Our interval, 340.6 to 399.4, is also fixed after we calculate it. So the true mean is either inside it or not inside it. There is no 95% chance for this one interval.

What changes from sample to sample is the interval. The 95% describes the method. If we use this method many times, it works about 95% of the time.

Look at the plot. Here we pretend the true mean is 370, with a standard error of 15, like our example. Again, most intervals catch the true mean, and about 5 out of 100 miss.

Many people say sentence 1 at work. It is a very common mistake. Please remember sentence 2.

Next question: what makes an interval wide or narrow?

---
class: small
# What Affects the Width of the Interval?

The margin of error is `\(z_{\alpha/2}\dfrac{\sigma}{\sqrt{n}}\)`. Three things change it (POSCO example, `\(\bar{x} = 370\)`):

|Setting|Interval|Width|
|:---|:---:|:---:|
|Base: 95%, `\(\sigma = 75\)`, `\(n = 25\)`|340.6 to 399.4|58.8|
|Lower confidence: 90%|345.3 to 394.7|49.4|
|Higher confidence: 99%|331.3 to 408.7|77.4|
|More variability: `\(\sigma = 150\)`|311.2 to 428.8|117.6|
|Larger sample: `\(n = 100\)`|355.3 to 384.7|29.4|

.content-box-blue[
- Higher confidence level → **wider** interval
- Larger population SD `\(\sigma\)` → **wider** interval
- Larger sample size `\(n\)` → **narrower** interval (4 times the sample halves the width)
]

???

We saw that the width of the interval can change. The width is the upper limit minus the lower limit. It is two times the margin of error.

Let's use the POSCO example. The base case is 95%, sigma 75, and n 25. The interval is 340.6 to 399.4. The width is 58.8.

Now we change one thing at a time. With 90% confidence, the width goes down to 49.4. With 99% confidence, the width goes up to 77.4. With more variability, sigma 150, the width doubles to 117.6. Variability means how much the demand changes from one period to another. With a larger sample, n 100, the width is 29.4. That is half of the base.

Look at the last row. We used 4 times the sample, 100 instead of 25. The width became half. Why? Because of the square root. The square root of 4 is 2.

So, to get a narrower interval, we can collect more data. But data costs money. How much data do we need? That is our next question.

---
class: small
# Selecting the Sample Size

Before collecting data, we can ask: **how large a sample do we need** for a margin of error no bigger than `\(B\)`?

.content-box-blue[
Set the margin of error equal to `\(B\)` and solve for `\(n\)`:
`$$B = z_{\alpha/2}\frac{\sigma}{\sqrt{n}} \quad\Rightarrow\quad n = \left(\frac{z_{\alpha/2}\,\sigma}{B}\right)^2$$`
]

???

Now we ask a different question. Before we collect any data, we ask: how large a sample do we need?

First, we choose B. B is the margin of error we can accept. It is the largest distance we allow between our estimate and the true mean.

Then we set B equal to z times sigma over root n, and we solve for n. The result: n equals z times sigma divided by B, and then squared.

For example, an online shop may want to estimate the mean amount that customers spend per order, within 1,000 won. This formula tells the shop how many orders to check before they start.

Let's try it with the POSCO example.

--

- Example: POSCO wants to estimate mean demand within **±10 units** at 95% confidence ( `\(\sigma = 75\)` ).
`$$n = \left(\frac{1.96 \times 75}{10}\right)^2 = (14.7)^2 = 216.09$$`
- Always **round up**: the manager needs a sample of **217** lead times.

???

The manager wants to estimate mean demand within plus or minus 10 units, at 95% confidence. Sigma is 75. So z is 1.96, sigma is 75, and B is 10.

First, 1.96 times 75 is 147. Divide by 10, and we get 14.7. Then square it. 14.7 times 14.7 is 216.09.

But we cannot sample 216.09 lead times. We need a whole number. And we always round up, never down. Why? If we round down to 216, the margin of error becomes a little bigger than 10. If we round up, it stays within 10.

So the manager needs 217 lead times.

Now it is your turn to practice.

]

- Q1. Find the 95% confidence interval for the mean spending of all customers.

???

Here is Workout 1. The example is a coffee shop, but the steps are the same as in our POSCO example.

A manager samples 64 customers. Their mean spending is 8.40 dollars. Sigma is 4 dollars.

Notice one new word: right-skewed. It means most customers spend a small amount, but a few customers spend a lot. So the distribution has a long tail on the right side.

Please answer three questions. Q1: find the 95% confidence interval. Q2: explain what it means in one sentence. Q3: explain why we can still use z, even though spending is skewed.

A hint: start with the standard error, sigma over root n.

Take about five minutes. You can work with your neighbor. Then we will check the answers together.

---

# Workout 1: Building a CI — Answer ✏️

- Q1. `\(\sigma_{\bar{x}} = \dfrac{4}{\sqrt{64}} = 0.5\)`, so
`$$8.40 \pm 1.96(0.5) = 8.40 \pm 0.98 \quad\Rightarrow\quad 7.42 &lt; \mu &lt; 9.38$$`

- Q2. We are 95% confident that the mean spending of all customers is between 7.42 and 9.38 dollars.

- Q3. `\(n = 64 \geq 30\)`, so by the Central Limit Theorem `\(\bar{X}\)` is approximately normal, even though individual spending is skewed.

???

Let's check the answers together.

Q1. First, the standard error. The square root of 64 is 8. 4 divided by 8 is 0.5. For 95%, z is 1.96. 1.96 times 0.5 is 0.98. That is the margin of error. 8.40 minus 0.98 is 7.42. 8.40 plus 0.98 is 9.38. So the interval is 7.42 to 9.38 dollars.

Q2. We are 95% confident that the mean spending of all customers is between 7.42 and 9.38 dollars. Notice: we talk about the mean of all customers, not about one customer.

Q3. The sample size is 64. That is 30 or more. So by the Central Limit Theorem, x-bar is approximately normal, even if the spending of single customers is skewed.

The same is true at POSCO. Single delivery lead times can be skewed, but the mean of a large sample is close to normal.

Workout 2 is about changing the confidence level.

A battery maker says its batteries last 26 hours on average. A tester checks a random sample of 25 batteries. The mean life is 25.0 hours. Sigma is 2.5 hours.

Please find two intervals: one at 90%, and one at 99%. Then compare them. Which one is wider? Why?

Last, look at the claim of 26 hours. Is 26 inside each interval?

Remember the z values: 1.645 for 90%, and 2.58 for 99%.

Take about five minutes. Then we will check together.

# Workout 2: Changing the Confidence Level — Answer ✏️

- Standard error: `\(\sigma_{\bar{x}} = \dfrac{2.5}{\sqrt{25}} = 0.5\)`

- Q1. 90%: `\(25.0 \pm 1.645(0.5) = 25.0 \pm 0.82 \quad\Rightarrow\quad 24.18 &lt; \mu &lt; 25.82\)`

- Q2. 99%: `\(25.0 \pm 2.58(0.5) = 25.0 \pm 1.29 \quad\Rightarrow\quad 23.71 &lt; \mu &lt; 26.29\)`

- Q3. The 99% interval is wider. To be more confident, we need a larger `\(z_{\alpha/2}\)`, so the interval must be wider.

- Q4. 26 is **outside** the 90% interval but **inside** the 99% interval. Whether the claim looks believable depends on how confident we want to be. This is the idea behind **hypothesis testing** (next class).

???

Let's check. First, the standard error. The square root of 25 is 5. 2.5 divided by 5 is 0.5.

Q1, 90%. 1.645 times 0.5 is 0.8225. We round it to 0.82. 25.0 minus 0.82 is 24.18. 25.0 plus 0.82 is 25.82. So the interval is 24.18 to 25.82 hours.

Q2, 99%. 2.58 times 0.5 is 1.29. 25.0 minus 1.29 is 23.71. 25.0 plus 1.29 is 26.29. So the interval is 23.71 to 26.29 hours.

Q3. The 99% interval is wider. To be more confident, we need a larger z value, so the range must be wider.

Q4. This is the interesting part. 26 is outside the 90% interval, because 25.82 is less than 26. But 26 is inside the 99% interval, because 26.29 is more than 26.

So, should we believe the claim? It depends on how confident we want to be. This is the main idea of hypothesis testing. Hypothesis testing is a method to check a claim with data. We will learn it next class.

# Workout 3: How Many Do We Need? ✏️
.content-box-grey[
HR wants to estimate the mean daily commute time of employees. From past surveys, `\(\sigma = 12\)` minutes.
]

- Q1. How many employees should HR sample to estimate the mean within ±2 minutes at 95% confidence?
- Q2. What if HR wants to be within ±1 minute instead?

???

Workout 3 is about sample size.

HR wants to estimate the mean daily commute time of employees. Commute time is the time to travel from home to work. From past surveys, sigma is 12 minutes.

Q1: how many employees should HR sample for a margin of error of plus or minus 2 minutes, at 95% confidence?

Q2: what if HR wants plus or minus 1 minute?

Use the formula: n equals z times sigma divided by B, and then squared. And remember to round up.

Take three minutes.

--

- Q1. `\(n = \left(\dfrac{1.96 \times 12}{2}\right)^2 = (11.76)^2 = 138.30\)`, so sample **139** employees.
- Q2. `\(n = \left(\dfrac{1.96 \times 12}{1}\right)^2 = (23.52)^2 = 553.19\)`, so sample **554** employees.
- Cutting the margin of error in half needs about **4 times** the sample.

???

Let's check.

Q1. 1.96 times 12 is 23.52. Divide by 2, and we get 11.76. Square it: 11.76 times 11.76 is about 138.30. Round up. HR needs 139 employees.

Q2. Now B is 1. 23.52 divided by 1 is still 23.52. Square it: about 553.19. Round up. HR needs 554 employees.

Look at the result. We made the margin of error half as big, from 2 minutes to 1 minute. But the sample size became about 4 times bigger, from 139 to 554.

This is important for planning at work. For example, if a polling company wants its margin of error to be half as big, it must ask about four times as many people. More precision costs more.

Now let's see how to get a confidence interval with software. We will use jamovi. It is free, and it is easy to use.

First, go to the jamovi website. Download the software and install it.

Then there are four steps. One: open your data file. Two: click Analyses, then Exploration, then Descriptives. Three: move your variable into the Variables box. For example, a column of monthly phone bills. Four: under Statistics, check "Std. error of Mean" and "Confidence interval for Mean." The default level is 95%.

Please read the note in the blue box. In real data, we usually do not know sigma. So jamovi uses s, the sample standard deviation, and the t distribution. Its interval can be a little wider than our z interval. Please do not worry about this. We will learn the t distribution soon.

Now let's review what we learned today.

# Summary

.content-box-blue[
- A **point estimate** gives one number; an **interval estimate** gives a range plus a confidence level.
- A good estimator is **unbiased**, **consistent**, and **relatively efficient**. `\(\bar{x}\)` is all three.
- Confidence interval for `\(\mu\)` ( `\(\sigma\)` known): `\(\bar{x} \pm z_{\alpha/2}\dfrac{\sigma}{\sqrt{n}}\)`
- "95% confidence" means: 95% of intervals built this way capture `\(\mu\)`.
- The interval is wider with higher confidence or larger `\(\sigma\)`, and narrower with larger `\(n\)`.
- Sample size for a margin of error `\(B\)`: `\(n = \left(\dfrac{z_{\alpha/2}\,\sigma}{B}\right)^2\)`, always round up.
]

???

Let's review today's main points.

One: a point estimate is one number. An interval estimate is a range, with a confidence level.

Two: a good estimator is unbiased, consistent, and relatively efficient. x-bar has all three qualities.

Three: when sigma is known, the confidence interval for mu is x-bar plus or minus z times sigma over the square root of n.

Four: 95% confidence is about the method. If we repeat it many times, about 95% of the intervals include the true mean.

Five: the interval is wider with higher confidence or a larger sigma. It is narrower with a larger sample.

Six: for a margin of error B, the sample size is z times sigma divided by B, squared. Always round up.

Any questions? Here is one to think about. Choose one number from your own life or work, for example the length of your team meetings. How would you estimate its mean?
